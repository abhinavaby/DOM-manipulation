<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Timer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .timer-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .inputs-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }

        input[type="number"] {
            width: 70px;
            height: 50px;
            background-color: var(--bg-color);
            border: 2px solid #334155;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        /* Remove spin buttons from number inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .display {
            font-size: 4.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin: 1.5rem 0;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-start {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-start:hover {
            background-color: var(--accent-hover);
        }

        .btn-pause {
            background-color: #475569;
            color: white;
            display: none;
        }

        .btn-pause:hover {
            background-color: #334155;
        }

        .btn-reset {
            background-color: transparent;
            border: 2px solid #334155;
            color: var(--text-muted);
        }

        .btn-reset:hover {
            border-color: #475569;
            color: var(--text-main);
        }

        /* Running state variations */
        .running .display {
            color: var(--accent-color);
        }

        .running input {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="timer-container" id="timerContainer">
        <h1>Countdown Timer</h1>
        
        <div class="inputs-wrapper">
            <div class="input-group">
                <label>Hrs</label>
                <input type="number" id="hrsInput" min="0" max="99" value="0" placeholder="00">
            </div>
            <div class="input-group">
                <label>Min</label>
                <input type="number" id="minsInput" min="0" max="59" value="5" placeholder="00">
            </div>
            <div class="input-group">
                <label>Sec</label>
                <input type="number" id="secsInput" min="0" max="59" value="0" placeholder="00">
            </div>
        </div>

        <div class="display" id="timeDisplay">00:05:00</div>

        <div class="controls">
            <button class="btn-start" id="startBtn">Start</button>
            <button class="btn-pause" id="pauseBtn">Pause</button>
            <button class="btn-reset" id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        let countdownInterval = null;
        let totalSecondsRemaining = 0;
        let isPaused = true;

        const hrsInput = document.getElementById('hrsInput');
        const minsInput = document.getElementById('minsInput');
        const secsInput = document.getElementById('secsInput');
        const timeDisplay = document.getElementById('timeDisplay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timerContainer = document.getElementById('timerContainer');

        function updateDisplay(totalSecs) {
            const hrs = Math.floor(totalSecs / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;

            timeDisplay.textContent = 
                `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function getSecondsFromInputs() {
            const h = parseInt(hrsInput.value) || 0;
            const m = parseInt(minsInput.value) || 0;
            const s = parseInt(secsInput.value) || 0;
            return (h * 3600) + (m * 60) + s;
        }

        function startTimer() {
            if (isPaused) {
                // If starting fresh, fetch layout inputs; if resuming from pause, maintain current index tracking
                if (totalSecondsRemaining <= 0) {
                    totalSecondsRemaining = getSecondsFromInputs();
                }

                if (totalSecondsRemaining <= 0) return; // Prevent run if set to zero

                isPaused = false;
                timerContainer.classList.add('running');
                startBtn.style.display = 'none';
                pauseBtn.style.display = 'inline-block';

                countdownInterval = setInterval(() => {
                    totalSecondsRemaining--;
                    updateDisplay(totalSecondsRemaining);

                    if (totalSecondsRemaining <= 0) {
                        clearInterval(countdownInterval);
                        resetTimer();
                        alert("Time's up!");
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            isPaused = true;
            clearInterval(countdownInterval);
            timerContainer.classList.remove('running');
            pauseBtn.style.display = 'none';
            startBtn.style.display = 'inline-block';
            startBtn.textContent = 'Resume';
        }

        function resetTimer() {
            isPaused = true;
            clearInterval(countdownInterval);
            totalSecondsRemaining = 0;
            
            timerContainer.classList.remove('running');
            startBtn.style.display = 'inline-block';
            startBtn.textContent = 'Start';
            pauseBtn.style.display = 'none';
            
            // Sync user UI layout view to match input boxes again
            updateDisplay(getSecondsFromInputs());
        }

        // Real-time viewer adjustment logic while editing input blocks
        function syncDisplayFromInputs() {
            if (isPaused && totalSecondsRemaining === 0) {
                updateDisplay(getSecondsFromInputs());
            }
        }

        hrsInput.addEventListener('input', syncDisplayFromInputs);
        minsInput.addEventListener('input', syncDisplayFromInputs);
        secsInput.addEventListener('input', syncDisplayFromInputs);

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Run setup view on launch execution
        syncDisplayFromInputs();
    </script>
</body>
</html>
